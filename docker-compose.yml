services:
  glm-ocr-server:
    image: vllm/vllm-openai:latest
    container_name: ocr_glm
    ports:
      - "8080:8080"
    command: ["--model", "zai-org/GLM-OCR", "--port", "8080", "--served-model-name", "glm-ocr"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - glm_data:/root/.cache/huggingface

  ocr-cannabis:
    build: .
    container_name: ocr_prescrizioni
    ports:
      - "8501:8501"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    depends_on:
      - glm-ocr-server

volumes:
  glm_data:
