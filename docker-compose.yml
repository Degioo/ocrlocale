version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ocr_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  ocr-cannabis:
    build: .
    container_name: ocr_prescrizioni
    ports:
      - "8501:8501"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    depends_on:
      - ollama

volumes:
  ollama_data:
